plugins {
    id 'net.minecraftforge.gradle' version '5.1.77'
}

group = 'com.chenray'
version = project.mod_version

archivesBaseName = 'tpoffline-forge'

// 共享 common 源码（跨平台核心逻辑）
sourceSets {
    main {
        java.srcDirs += ['../common/src/main/java']
    }
}

minecraft {
    mappings channel: 'official', version: '1.16.5'
}

dependencies {
    minecraft "net.minecraftforge:forge:1.16.5-36.2.42"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    // Forge 1.16.5 目标为 Java 8（用 -source/-target，避免 --release 被 FG 内部 JDK8 javac 拒绝）
    it.options.sourceCompatibility = '1.8'
    it.options.targetCompatibility = '1.8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
    from("${rootDir}/../LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

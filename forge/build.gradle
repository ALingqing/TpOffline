plugins {
    id 'net.minecraftforge.gradle' version '6.0.25'
}

group = 'com.chenray'
version = project.mod_version

base {
    archivesName = 'tpoffline-forge'
}

// 共享 common 源码（跨平台核心逻辑）
sourceSets {
    main {
        java.srcDirs += ['../common/src/main/java']
    }
}

minecraft {
    mappings channel: 'official', version: '1.18.2'
    reobf = false
}

dependencies {
    minecraft "net.minecraftforge:forge:1.18.2-40.3.12"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    // Forge 1.20.1 目标为 Java 17
    it.options.release = 17
}

java {
    // 编译目标 Java 17（用当前 JDK 21 编译）
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("${rootDir}/../LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

plugins {
    id 'net.minecraftforge.gradle' version '4.1.16'
}

group = 'com.chenray'
version = project.mod_version

archivesBaseName = 'tpoffline-forge'

// 共享 common 源码（跨平台核心逻辑）
sourceSets {
    main {
        java.srcDirs += ['../common/src/main/java']
    }
}

minecraft {
    // 1.16.5 用 MCP 快照映射（编译环境为可读的 MCP 名）
    mappings channel: 'snapshot', version: '20210309-1.16.5'
}

dependencies {
    minecraft "net.minecraftforge:forge:1.16.5-36.2.42"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    // 源码为 UTF-8 编码（避免 Windows 本地 GBK 误读）
    it.options.encoding = 'UTF-8'
    // Forge 1.16.5 目标为 Java 8（用 -source/-target，避免 --release 被 FG 内部 JDK8 javac 拒绝）
    it.sourceCompatibility = JavaVersion.VERSION_1_8
    it.targetCompatibility = JavaVersion.VERSION_1_8
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// FG 4.1.16 在 CI 上无法从 files.minecraftforge.net 下载 MCP 数据（301 重定向问题），
// 预放置已生成的 srg_to_snapshot tsrg 到 FG 缓存，跳过下载
tasks.withType(JavaCompile).configureEach {
    doFirst {
        def fgCache = new File(gradle.gradleUserHomeDir,
                "caches/forge_gradle/minecraft_user_repo/de/oceanlabs/mcp/mcp_config/1.16.5-20210115.111550/srg_to_snapshot_20210309-1.16.5.tsrg")
        def src = new File(rootDir.parentFile, "forge/srg_to_snapshot_20210309-1.16.5.tsrg")
        if (src.exists() && !fgCache.exists()) {
            fgCache.parentFile.mkdirs()
            java.nio.file.Files.copy(src.toPath(), fgCache.toPath())
            println "预放置 srg_to_snapshot tsrg -> $fgCache"
        }
    }
}

jar {
    from("${rootDir}/../LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

name: Build Mod (Fabric / Forge / NeoForge)

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 预下载 MCP 映射数据（FG 4.1.16 在 CI 上直连 files.minecraftforge.net 下载失败）
      - name: Pre-download MCP data
        run: |
          MCP_DIR="$HOME/.gradle/caches/forge_gradle/maven_downloader/de/oceanlabs/mcp/mcp_snapshot/20210309-1.16.5"
          mkdir -p "$MCP_DIR"
          curl -fsSL -o "$MCP_DIR/mcp_snapshot-20210309-1.16.5.zip" \
            "https://maven.minecraftforge.net/de/oceanlabs/mcp/mcp_snapshot/20210309-1.16.5/mcp_snapshot-20210309-1.16.5.zip"
          echo "61dfa77f6f2eab4a658d390c0517dc4e" > "$MCP_DIR/mcp_snapshot-20210309-1.16.5.zip.md5"

      # 每个分支只构建该版本适用的平台（目录存在的平台才会被构建）
      - name: Build platforms
        shell: bash
        run: |
          set -eo pipefail
          for platform in fabric forge neoforge; do
            if [ -f "$platform/build.gradle" ]; then
              echo "==> Building $platform"
              ./gradlew -p "$platform" build --console=plain 2>&1 | tee "/tmp/gradle-$platform.log"
            else
              echo "==> $platform 不适用于本分支，跳过"
            fi
          done

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          for f in /tmp/gradle-*.log; do
            [ -f "$f" ] || continue
            echo "::error::===== $(basename "$f") ====="
            grep -E 'What went wrong|Could not|Caused by|FAILURE|Execution failed|> Task.*FAILED|error:' "$f" | tail -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tpoffline-jars
          path: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: warn
